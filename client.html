<title>The Living Grimoire</title>

<style> body { background: #14171a; color: #ccd3d2;
         font-family: monospace; padding: 20px; }
         #log { white-space: pre-wrap; margin-bottom: 12px; }
         #input { width: 100%; background: #181c1f; color: #d9a05b;
         border: 1px solid #23292d; font-family: monospace;
         font-size: 1rem; padding: 6px; }
</style>
<div id="log"></div>
<input id="input" autofocus>

<script>
  const socket = new WebSocket("ws://localhost:8765");
  const log = document.getElementById("log");
  const input = document.getElementById("input");

  function append(text) {
  log.textContent += text + "\n";
}

socket.onopen = () => append("connected");

socket.onmessage = (event) => {
  append(event.data);
};

socket.onclose = () => append("disconnected");

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    socket.send(input.value);
    input.value = "";
  }
});
</script>
